# Example brief: a second explainer, ready to scaffold.
#
# Scaffold it with:
#     uv run manimations new dns --brief examples/dns_brief.yaml --dir projects/dns
#
# The scene classes referenced here are generated as runnable stubs; replace
# their placeholder bodies with the real diagrams.

title: "How DNS Turns Names Into Addresses"
slug: dns
description: "A short explainer on the Domain Name System"
author: "Manimations"
narration_voice: alba
subtitle_lang: en

scenes:
  - id: 00_cold_open
    class: SceneColdOpen
    accent: cyan
    duration: 5
    narration: ""
    visuals: [title-card]
    notes: "Silent title card."

  - id: 01_problem
    class: SceneProblem
    accent: amber
    duration: 15
    narration: "You type a name like example dot com, but the network only understands addresses. Something has to translate between the two, every single time you click a link."
    visuals: [name-badge, address-badge, arrow]
    notes: "Show a human name resolving into an IP address."

  - id: 02_hierarchy
    class: SceneHierarchy
    accent: violet
    duration: 18
    narration: "No single machine holds every name. The system is a hierarchy: root servers point to top level domains, those point to authoritative servers, and each one only knows its own slice of the tree."
    visuals: [tree, root, tld, authoritative]
    notes: "Build the resolution tree from the root downward."

  - id: 03_lookup
    class: SceneLookup
    accent: green
    duration: 18
    narration: "When you look something up, your resolver walks that tree step by step, and then caches the answer so the next request is instant. The record carries a time to live that says how long it may be reused."
    visuals: [query-path, cache, ttl]
    notes: "Animate a query down the tree and the cached answer back."

  - id: 04_conclusion
    class: SceneConclusion
    accent: cyan
    duration: 12
    narration: "DNS is the internet's phone book, but it is really a distributed, cached, hierarchical database. That design is exactly what lets it scale to billions of names."
    visuals: [summary]
    notes: "Three takeaways, then settle."
