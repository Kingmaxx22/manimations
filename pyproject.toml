[project]
name = "manimations"
version = "0.1.0"
description = "Automated 2D educational motion-graphics system built on Manim Community Edition."
readme = "README.md"
authors = [
    { name = "Akbar Maulana Perdana", email = "akbarperdana49@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "manim>=0.18",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Narration is optional: everything else works without it.
tts = ["pocket-tts>=3.3.0"]
# VoxCPM is an alternative narration backend (more expressive, GPU-class):
# a 2B model that needs PyTorch + CUDA and Python < 3.13.
voxcpm = ["voxcpm>=2.0.0", "soundfile>=0.12"]

[project.scripts]
manimations = "manimations.cli:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "manimations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: end-to-end tests that really render with Manim and FFmpeg",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
